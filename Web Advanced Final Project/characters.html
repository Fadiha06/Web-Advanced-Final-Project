<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>characters</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <nav class="navbar">
    <div class="navbar-logo">Rick & Morty</div>
    <ul class="nav-links">
      <li><a href="characters.html" class="active">Characters</a></li>
      <li><a href="episodes.html">Episodes</a></li>
      <li><a href="locations.html">Locations</a></li>
      <li><a href="favorites.html">Favorites</a></li>
      <li><a href="gekeken.html">Watched</a></li>
    </ul>
 <button id="theme-toggle" class="theme-btn">🌙</button>
  
  </nav>

  <h1>Characters</h1>
  <div class="filters-wrapper">
    <input type="text" id="search" placeholder="🔍 Zoek op naam..." class="filter-input">
    <select id="filter-status" class="filter-select">
      <option value="">Alle statussen</option>
      <option value="Alive">Alive</option>
      <option value="Dead">Dead</option>
      <option value="unknown">Unknown</option>
    </select>
    <select id="filter-species" class="filter-select">
      <option value="">Alle soorten</option>
      <option value="Human">Human</option>
      <option value="Alien">Alien</option>
      <option value="Humanoid">Humanoid</option>
      <option value="Robot">Robot</option>
      <option value="unknown">Unknown</option>
    </select>
    <select id="filter-gender" class="filter-select">
      <option value="">Alle genders</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Genderless">Genderless</option>
      <option value="unknown">Unknown</option>
    </select>
    <select id="sort" class="filter-select">
      <option value="id-asc">ID ↑</option>
      <option value="id-desc">ID ↓</option>
      <option value="name-asc">Naam A-Z</option>
      <option value="name-desc">Naam Z-A</option>
    </select>
  </div>
  <div class="cards-wrapper" id="characters-container"></div>
    

   <div id="modal">
    <div class="modal-content">
      <img id="modal-img" src="" alt="">
      <div class="modal-details">
        <h2 id="modal-name"></h2>
        <p><span>Status:</span> <span id="modal-status"></span></p>
        <p><span>Species:</span> <span id="modal-species"></span></p>
        <p><span>Gender:</span> <span id="modal-gender"></span></p>
        <p><span>Origin:</span> <span id="modal-origin"></span></p>
        <p><span>Location:</span> <span id="modal-location"></span></p>
        <p><span>Episodes:</span> <span id="modal-episodes"></span></p>
      </div>
    </div>
  </div>


  <script src="script-characters.js"></script>
  <script src="theme.js"></script>

</body>
</html>

    
</body>
</html>
