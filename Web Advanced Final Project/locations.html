  <nav class="navbar">
    <a href="index.html" class="navbar-logo">Rick & Morty</a>

  <h1>Locations</h1>

  <div class="filters-wrapper">
    <input type="text" id="search" placeholder="🔍 Zoek op naam..." class="filter-input">
    <select id="filter-type" class="filter-select">
      <option value="">Alle types</option>
      <option value="Planet">Planet</option>
      <option value="Space station">Space station</option>
      <option value="Microverse">Microverse</option>
      <option value="TV">TV</option>
      <option value="Resort">Resort</option>
      <option value="Fantasy town">Fantasy town</option>
      <option value="Dream">Dream</option>
    </select>
    <select id="sort" class="filter-select">
      <option value="id-asc">ID ↑</option>
      <option value="id-desc">ID ↓</option>
      <option value="name-asc">Naam A-Z</option>
      <option value="name-desc">Naam Z-A</option>
      <option value="residents-desc">Meeste bewoners</option>
      <option value="residents-asc">Minste bewoners</option>
    </select>
  </div>

  <div class="cards-wrapper" id="locations-container"></div>

  <script src="src/script-locations.js"></script>
